<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Edit Task</h1>
        
        <!-- Submits back to the current edit route with the task's ID -->
        <form class="add-form" action="{{ url_for('edit_todo', todo_id=todo.id) }}" method="POST">
            <!-- value="{{ todo.task }}" pre-fills the input box with the current text -->
            <input type="text" name="task" value="{{ todo.task }}" required autofocus>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>

        <!-- Cancel link to go back to the home page without saving changes -->
        <div style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('get_todos') }}" style="color: #6b7280; text-decoration: none; font-size: 14px;">Cancel</a>
        </div>
    </div>
</body>
</html>
